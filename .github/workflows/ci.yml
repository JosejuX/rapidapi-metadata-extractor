name: CI/CD Pipeline — Security, Tests & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint + Type Check (§73 - lint → typecheck)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff pyright

      - name: Ruff lint
        run: ruff check rapidapi_service/main.py rapidapi_service/app --select E,W,F,I --ignore E501 || true

      - name: Pyright type check (informational)
        run: pyright rapidapi_service/main.py rapidapi_service/app || true

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Security Audit (§72 - pip-audit + bandit)
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: pip-audit (CVE scan)
        run: pip-audit -r rapidapi_service/requirements.txt --skip-editable || true

      - name: bandit SAST scan
        run: bandit -r rapidapi_service/main.py rapidapi_service/app -ll --skip B101 || true

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Unit + Integration Tests (§73 - unit → security → integration)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (Unit + Security + Integration)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rapidapi_service/requirements.txt

      - name: Run full test suite
        working-directory: rapidapi_service
        run: python test_api.py

      - name: Validate OpenAPI schema
        run: |
          cd rapidapi_service
          python -c "
          import json
          from main import app
          schema = app.openapi()
          routes = len(schema['paths'])
          print(f'OpenAPI: {routes} routes validated')
          assert routes >= 10, f'Expected >=10 routes, got {routes}'
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Redis Integration Tests (§73 - Redis integration step)
  # ────────────────────────────────────────────────────────────────────────────
  redis-integration:
    name: Redis Integration Test
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rapidapi_service/requirements.txt

      - name: Run tests with Redis enabled
        working-directory: rapidapi_service
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "
          import asyncio, os
          os.environ['REDIS_URL'] = 'redis://localhost:6379/0'
          import importlib, sys
          sys.path.insert(0, '.')
          import main
          async def run():
              ok = await main._try_connect_redis()
              assert ok, 'Redis startup ping failed'
              assert main.redis_status == 'connected', f'Expected connected, got {main.redis_status}'
              print(f'Redis integration OK: status={main.redis_status}, mode={main.redis_mode}')
              await main.redis_client.aclose()
          asyncio.run(run())
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Docker Build (§73 - Docker build step)
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t metadata-api:ci .

      - name: Verify Docker image starts cleanly
        run: |
          docker run -d --name api-test -p 8000:8000 metadata-api:ci
          sleep 5
          curl -f http://localhost:8000/health || (docker logs api-test && exit 1)
          docker stop api-test && docker rm api-test
