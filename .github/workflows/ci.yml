name: API Security & CI Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rapidapi_service/requirements.txt

      - name: Run Test & Benchmark Suite
        run: |
          python rapidapi_service/test_api.py

      - name: Validate OpenAPI Schema Generation
        run: |
          python -c "import json; from rapidapi_service.main import app; schema = app.openapi(); print(f'OpenAPI endpoints validated: {len(schema[\"paths\"])} routes')"
