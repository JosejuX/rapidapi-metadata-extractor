name: CI/CD Pipeline — Security, Tests & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint + Type Check (§73 - lint → typecheck)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff pyright

      - name: Ruff lint
        run: ruff check rapidapi_service/main.py rapidapi_service/app --select E,W,F,I --ignore E501

      # Informational only: ~20 pre-existing type errors (generics in
      # cache/singleflight.py, FastAPI exception-handler signature typing,
      # config.py IPv4/IPv6Network union, etc.). Plan §74 explicitly calls for
      # *gradual* typing adoption rather than a blocking gate that stalls
      # unrelated PRs — flip to blocking once those are cleared.
      - name: Pyright type check (informational)
        run: pyright rapidapi_service/main.py rapidapi_service/app || true

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Security Audit (§72 - pip-audit + bandit)
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit bandit

      # Blocking, with a documented allowlist for known-accepted findings.
      # The 7 starlette advisories below (Host/path→request.url spoofing,
      # StaticFiles Range-header DoS, StaticFiles Windows-UNC SSRF, HTTPEndpoint
      # verb dispatch) were individually reviewed: this app never reads
      # request.url.hostname/path for a security decision (only a metrics
      # label in app/core/tracing.py) and never uses StaticFiles/FileResponse/
      # HTTPEndpoint, so none are reachable here. Bumping starlette to 1.x
      # (and fastapi alongside it, 26 minor versions behind) is a deliberate,
      # separately-tracked upgrade — not something to force through a CI gate.
      # Any *new* CVE in any dependency still fails the build.
      - name: pip-audit (CVE scan)
        run: |
          pip-audit -r rapidapi_service/requirements.txt --skip-editable \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280

      - name: bandit SAST scan
        run: bandit -r rapidapi_service/main.py rapidapi_service/app -ll --skip B101

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Unit + Integration Tests (§73 - unit → security → integration)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (Unit + Security + Integration)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rapidapi_service/requirements.txt
          pip install pytest hypothesis

      - name: Run fixture-based test suite (SSRF matrix, circuit breaker,
          singleflight, host concurrency, observability, quality checks)
        working-directory: rapidapi_service
        run: pytest tests/ -q

      - name: Run live-network smoke suite
        working-directory: rapidapi_service
        run: python test_api.py

      - name: Validate OpenAPI schema
        run: |
          cd rapidapi_service
          python -c "
          import json
          from main import app
          schema = app.openapi()
          routes = len(schema['paths'])
          print(f'OpenAPI: {routes} routes validated')
          assert routes >= 10, f'Expected >=10 routes, got {routes}'
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Redis Integration Tests (§73 - Redis integration step)
  # ────────────────────────────────────────────────────────────────────────────
  redis-integration:
    name: Redis Integration Test
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rapidapi_service/requirements.txt
          pip install pytest hypothesis

      - name: Run Redis-dependent test suite (rate-limit atomicity, etc.)
        working-directory: rapidapi_service
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -q

      - name: Run Redis connect/reconnect smoke check
        working-directory: rapidapi_service
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "
          import asyncio, os
          os.environ['REDIS_URL'] = 'redis://localhost:6379/0'
          import importlib, sys
          sys.path.insert(0, '.')
          import main
          async def run():
              ok = await main._try_connect_redis()
              assert ok, 'Redis startup ping failed'
              assert main.redis_status == 'connected', f'Expected connected, got {main.redis_status}'
              print(f'Redis integration OK: status={main.redis_status}, mode={main.redis_mode}')
              await main.redis_client.aclose()
          asyncio.run(run())
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Docker Build (§73 - Docker build step)
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t metadata-api:ci .

      - name: Verify Docker image starts cleanly
        run: |
          docker run -d --name api-test -p 8000:8000 metadata-api:ci
          sleep 5
          curl -f http://localhost:8000/health || (docker logs api-test && exit 1)
          docker stop api-test && docker rm api-test
