[pytest]
; Makes `app` importable regardless of how pytest is invoked (bare `pytest`,
; `python -m pytest`, from CI or locally). Without this, pytest's own
; rootdir-detection only adds `tests/` itself to sys.path (since it has no
; __init__.py), never the parent `rapidapi_service/` directory where `app/`
; actually lives — `python -m pytest` masks this locally because `-m`
; unconditionally prepends the current working directory to sys.path, but
; the bare `pytest` console script (what CI actually runs) does not.
pythonpath = .
