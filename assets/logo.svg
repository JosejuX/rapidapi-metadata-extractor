<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <style><![CDATA[
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="500" height="500" rx="96" fill="#09080f"/>
  <circle cx="120" cy="110" r="170" fill="url(#glow-a)" filter="url(#blur)"/>
  <circle cx="380" cy="400" r="180" fill="url(#glow-b)" filter="url(#blur)"/>

  <rect x="0" y="0" width="500" height="500" rx="96" fill="none" stroke="#2a2740" stroke-width="3"/>

  <text x="250" y="322" text-anchor="middle" class="mono" font-size="240" font-weight="700" fill="url(#mark-grad)">W</text>

  <rect x="126" y="368" width="248" height="8" rx="4" fill="#2a2740"/>
  <rect x="126" y="368" width="150" height="8" rx="4" fill="url(#mark-grad)"/>
</svg>
