<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Turn any URL into structured intelligence — Web Metadata, OpenGraph and Contact Extractor API">
  <title>Turn any URL into structured intelligence</title>
  <defs>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1200" height="400" rx="18" ry="18"/>
    </clipPath>
    <linearGradient id="headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="blob-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <style><![CDATA[
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .eyebrow { fill: #726b8f; font-size: 15px; letter-spacing: 3px; font-weight: 600; }
      .headline { fill: url(#headline-grad); font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
      .url-text { fill: #f2effa; font-size: 18px; }
      .url-cursor { fill: #22d3ee; }
      .chip-bg { fill: #14111f; stroke: #2a2740; stroke-width: 1.5; }
      .chip-label { fill: #726b8f; font-size: 12px; letter-spacing: 0.5px; }
      .chip-value { font-size: 22px; font-weight: 700; }
      .flow-line { stroke: #2a2740; stroke-width: 2; stroke-dasharray: 4 5; }
      .arrow { fill: #4b4470; }

      @keyframes cursor-blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
      .url-cursor { animation: cursor-blink 1.1s steps(1, end) infinite; }
    ]]></style>
  </defs>

  <g clip-path="url(#banner-clip)">
    <rect x="0" y="0" width="1200" height="400" fill="#09080f"/>
    <circle cx="90" cy="60" r="220" fill="url(#blob-a)" filter="url(#soft-blur)"/>
    <circle cx="1130" cy="370" r="240" fill="url(#blob-b)" filter="url(#soft-blur)"/>

    <!-- Left: positioning + URL input -->
    <text x="64" y="90" class="sans eyebrow">WEB INTELLIGENCE API</text>
    <text x="62" y="150" class="sans headline">Turn any URL into</text>
    <text x="62" y="200" class="sans headline">structured intelligence.</text>

    <rect x="64" y="240" width="420" height="56" rx="12" fill="#14111f" stroke="#2a2740" stroke-width="1.5"/>
    <circle cx="96" cy="268" r="7" fill="none" stroke="#726b8f" stroke-width="2"/>
    <line x1="101" y1="273" x2="108" y2="280" stroke="#726b8f" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="274" class="mono url-text">https://yourcompany.com<tspan class="mono url-cursor">|</tspan></text>

    <text x="64" y="330" class="sans" fill="#4b4470" font-size="14">One HTTP GET. SEO, tech stack, contacts, products, social &amp; security — back in ms.</text>

    <!-- Flow line -->
    <line x1="500" y1="268" x2="556" y2="268" class="flow-line"/>
    <path d="M 552 260 L 566 268 L 552 276 Z" class="arrow"/>

    <!-- Right: result chips (2 rows x 3 cols) -->
    <g class="chip-1">
      <rect x="600" y="76" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="622" cy="100" r="5" fill="#a78bfa"/>
      <text x="636" y="105" class="sans chip-label">SEO</text>
      <text x="622" y="140" class="mono chip-value" fill="#a78bfa">92<tspan font-size="13" fill="#726b8f">/100</tspan></text>
    </g>
    <g class="chip-2">
      <rect x="784" y="76" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="806" cy="100" r="5" fill="#22d3ee"/>
      <text x="820" y="105" class="sans chip-label">TECHNOLOGIES</text>
      <text x="806" y="140" class="mono chip-value" fill="#22d3ee">6</text>
    </g>
    <g class="chip-3">
      <rect x="968" y="76" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="990" cy="100" r="5" fill="#f472b6"/>
      <text x="1004" y="105" class="sans chip-label">SOCIAL</text>
      <text x="990" y="140" class="mono chip-value" fill="#f472b6">5</text>
    </g>
    <g class="chip-4">
      <rect x="600" y="176" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="622" cy="200" r="5" fill="#fbbf24"/>
      <text x="636" y="205" class="sans chip-label">CONTACTS</text>
      <text x="622" y="240" class="mono chip-value" fill="#fbbf24">2</text>
    </g>
    <g class="chip-5">
      <rect x="784" y="176" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="806" cy="200" r="5" fill="#fb7185"/>
      <text x="820" y="205" class="sans chip-label">SECURITY</text>
      <text x="806" y="240" class="mono chip-value" fill="#fb7185">78<tspan font-size="13" fill="#726b8f">/100</tspan></text>
    </g>
    <g class="chip-6">
      <rect x="968" y="176" width="168" height="84" rx="12" class="chip-bg"/>
      <circle cx="990" cy="200" r="5" fill="#34d399"/>
      <text x="1004" y="205" class="sans chip-label">AI MARKDOWN</text>
      <text x="990" y="240" class="mono chip-value" fill="#34d399">✓</text>
    </g>

    <text x="600" y="300" class="mono" fill="#4b4470" font-size="13">GET /api/v1/extract?url=yourcompany.com  →  200 OK</text>
  </g>
</svg>
